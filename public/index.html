<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>绿茵神算 · 赛事预测看板</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">FIFA World Cup 2026</p>
          <h1>赛事预测看板</h1>
        </div>
        <div class="top-actions">
          <button class="ghost-button" id="settingsBtn" type="button">
            <i data-lucide="settings"></i>
            设置
          </button>
          <div class="status-pill" id="serverStatus">连接中</div>
        </div>
      </header>

      <section class="control-strip">
        <div class="segmented" aria-label="预测模式">
          <button class="segment active" data-mode="batch" type="button">批量整表</button>
          <button class="segment" data-mode="single" type="button">单场详情</button>
        </div>

        <label class="compact-field">
          日期
          <input id="fixtureDate" type="date" value="2026-06-16">
        </label>

        <label class="compact-field">
          范围
          <select id="fixtureWindow">
            <option value="1">当天</option>
            <option value="2">未来 2 天</option>
            <option value="3">未来 3 天</option>
            <option value="7">未来 7 天</option>
          </select>
        </label>

        <label class="toggle-field">
          <input id="includeFinished" type="checkbox">
          <span>包含已完赛</span>
        </label>

        <label class="toggle-field">
          <input id="autoIntel" type="checkbox" checked>
          <span>自动抓取情报</span>
        </label>

        <button class="secondary-button" id="refreshFixtures" type="button">
          <i data-lucide="refresh-cw"></i>
          刷新赛程
        </button>

        <button class="primary-button" id="generateBoard" type="button">
          <i data-lucide="sparkles"></i>
          生成当前表
        </button>
      </section>

      <section class="settings-panel hidden" id="settingsPanel">
        <label>
          API Key
          <input id="apiKey" type="password" autocomplete="off" placeholder="可留空：使用启动时的 DEEPSEEK_API_KEY">
        </label>
        <label>
          模型
          <input id="model" value="deepseek-chat">
        </label>
        <p>页面不保存 API Key；如果粘贴 Key，只会发给本机后端用于本次调用。</p>
      </section>

      <section class="dashboard-grid">
        <section class="panel fixtures-panel">
          <div class="panel-header">
            <div>
              <h2>官方赛程</h2>
              <p id="fixtureMeta">正在读取 FIFA 赛程</p>
            </div>
            <button class="ghost-button" id="selectVisible" type="button">
              <i data-lucide="check-square"></i>
              全选可预测
            </button>
          </div>

          <div class="fixture-table-wrap">
            <table class="fixture-table">
              <thead>
                <tr>
                  <th></th>
                  <th>时间</th>
                  <th>比赛</th>
                  <th>小组</th>
                  <th>状态</th>
                  <th>场地</th>
                </tr>
              </thead>
              <tbody id="fixturesBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel output-panel">
          <div class="panel-header">
            <div>
              <h2>预测结果</h2>
              <p id="outputMeta">选择比赛后生成，批量模式会输出整张表。</p>
            </div>
            <button class="ghost-button" id="clearResults" type="button">
              <i data-lucide="trash-2"></i>
              清空
            </button>
          </div>

          <div class="empty-state" id="emptyState">
            <i data-lucide="table-2"></i>
            <h2>等待生成赛事表</h2>
            <p>默认会自动加载 FIFA 官方赛程。你只需要选单场或批量，然后点生成。</p>
          </div>

          <div class="board-results hidden" id="boardResults"></div>
        </section>
      </section>

      <section class="panel review-panel">
        <div class="panel-header">
          <div>
            <h2>赛后复盘</h2>
            <p>点任意预测卡片设为复盘对象，再填实际比分。</p>
          </div>
          <div class="review-form">
            <input id="actualScore" placeholder="实际比分，如 1-1">
            <button class="secondary-button" id="reviewBtn" type="button">
              <i data-lucide="calculator"></i>
              计算
            </button>
          </div>
        </div>
        <div class="review-output" id="reviewOutput"></div>
      </section>

      <footer class="footer-note">
        数据源：FIFA 官方赛程页 + FIFA 单场页自动摘要。若首发、伤停或市场基线没有公开抓到，系统会降置信或 PASS。
      </footer>
    </main>
  </body>
</html>
